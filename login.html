<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    
    <title>Login - ITK SmartWaste</title>
    
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="manifest" href="manifest.json">

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

    <style>
        /* ================= DEKORASI DASAR ================= */
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Poppins', sans-serif; }
        
        html { background-color: #101210; } 

        body { 
            background: radial-gradient(circle at top left, #2b332b 0%, #101210 100%);
            background-color: #101210;
            background-attachment: fixed;
            color: #ffffff; 
            min-height: 100vh; 
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px; 
            
            /* 2. PERBAIKAN KUNCIAN CSS (ANTI GESER) */
            width: 100vw;
            max-width: 100vw;
            overflow-x: hidden;
            overscroll-behavior-y: none;
            touch-action: pan-y;
            -webkit-text-size-adjust: 100%;
        }

        /* ================= BUNGKUSAN LOGIN (SPLIT SCREEN) ================= */
        .login-container {
            display: flex;
            width: 1000px;
            max-width: 100%;
            min-height: 550px;
            background: rgba(16, 18, 16, 0.6);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 30px;
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.5);
            overflow: hidden;
            animation: slideUp 0.6s ease-out;
        }

        @keyframes slideUp { from { opacity: 0; transform: translateY(30px); } to { opacity: 1; transform: translateY(0); } }

        /* ================= KIRI: ILUSTRASI / BRANDING ================= */
        .login-left {
            flex: 1.2;
            background: linear-gradient(135deg, rgba(204, 255, 0, 0.05) 0%, rgba(0, 0, 0, 0) 100%);
            border-right: 1px solid rgba(255, 255, 255, 0.05);
            padding: 50px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            position: relative;
        }

        /* Efek Cahaya Neon di Belakang */
        .glowing-orb {
            position: absolute;
            width: 300px;
            height: 300px;
            background: #ccff00;
            filter: blur(120px);
            opacity: 0.15;
            border-radius: 50%;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 0;
            animation: pulseOrb 4s infinite alternate;
        }

        @keyframes pulseOrb { from { transform: translate(-50%, -50%) scale(1); } to { transform: translate(-50%, -50%) scale(1.1); opacity: 0.2; } }

        .brand-content { z-index: 1; display: flex; flex-direction: column; align-items: center; }
        
        #logo-3d-container { 
            width: 180px; 
            height: 180px; 
            margin-bottom: 10px; 
            position: relative;
            background: radial-gradient(circle at bottom, rgba(204,255,0,0.1) 0%, transparent 70%);
            border-radius: 50%;
        }

        .logo-text { font-size: 28px; font-weight: 700; letter-spacing: 1px; margin-bottom: 10px; }
        .logo-text span { color: #ccff00; }
        .brand-desc { color: #888; font-size: 14px; line-height: 1.6; max-width: 80%; margin: 0 auto; }

        /* ================= KANAN: FORM LOGIN ================= */
        .login-right {
            flex: 1;
            padding: 60px 50px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            background: rgba(255, 255, 255, 0.02);
        }

        .login-right h2 { font-size: 32px; font-weight: 600; margin-bottom: 10px; }
        .login-right p { color: #888; font-size: 14px; margin-bottom: 40px; }

        .form-group { margin-bottom: 25px; }
        .form-label { display: block; font-size: 13px; color: #aaa; margin-bottom: 10px; font-weight: 500; }
        
        .form-input { 
            width: 100%; 
            background: rgba(0,0,0,0.3); 
            border: 1px solid rgba(255,255,255,0.1); 
            color: #fff; 
            padding: 16px 20px; 
            border-radius: 12px; 
            font-size: 14px; 
            outline: none; 
            transition: 0.3s; 
        }
        .form-input:focus { border-color: #ccff00; background: rgba(204,255,0,0.02); box-shadow: 0 0 15px rgba(204,255,0,0.1); }
        
        .btn-login { 
            background: #ccff00; 
            color: #101210; 
            border: none; 
            padding: 16px; 
            border-radius: 12px; 
            font-weight: 700; 
            cursor: pointer; 
            transition: 0.3s; 
            width: 100%; 
            font-size: 16px; 
            margin-top: 10px;
        }
        .btn-login:hover { box-shadow: 0 0 20px rgba(204,255,0,0.4); transform: translateY(-2px); }
        .btn-login:disabled { opacity: 0.5; cursor: not-allowed; transform: none; box-shadow: none; }

        #error-msg { 
            background: rgba(255, 71, 87, 0.1); 
            color: #ff4757; 
            padding: 12px; 
            border-radius: 8px; 
            font-size: 13px; 
            margin-top: 20px; 
            display: none; 
            border: 1px solid rgba(255, 71, 87, 0.3); 
            text-align: center;
        }

        /* ================= RESPONSIVE (KHUSUS HP) ================= */
        @media (max-width: 768px) {
            body { padding: 0; align-items: flex-start; } 
            .login-container { 
                flex-direction: column; 
                min-height: 100vh; 
                width: 100%; 
                border-radius: 0; 
                border: none; 
                box-shadow: none;
            }
            .login-left { padding: 40px 20px; border-right: none; border-bottom: 1px solid rgba(255, 255, 255, 0.05); }
            .login-right { padding: 40px 25px; flex: 1; justify-content: center; }
            .glowing-orb { width: 200px; height: 200px; }
            #logo-3d-container { width: 140px; height: 140px; } 
        }

        /* ================= SPLASH SCREEN INTRO ================= */
        #splash-screen {
            position: fixed;
            top: 0; left: 0; width: 100vw; height: 100vh;
            background-color: #0a0c0a; /* Sama dengan warna tema */
            z-index: 99999; /* Pastikan selalu paling atas */
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            transition: opacity 0.8s ease-out, visibility 0.8s;
        }
        
        .splash-ring {
            width: 60px; height: 60px;
            border: 3px solid rgba(204, 255, 0, 0.1);
            border-top: 3px solid #ccff00;
            border-radius: 50%;
            margin-bottom: 20px;
            animation: spinFast 1s linear infinite;
        }

        .splash-text {
            font-size: 24px; font-weight: 700; color: #fff; letter-spacing: 2px;
        }
        .splash-text span { color: #ccff00; }
        .splash-sub {
            font-size: 11px; color: #888; letter-spacing: 2px; margin-top: 8px; text-transform: uppercase;
            animation: pulseFade 1.5s infinite;
        }

        @keyframes spinFast { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        @keyframes pulseFade { 0%, 100% { opacity: 0.4; } 50% { opacity: 1; } }
    </style>
</head>
<body>
    <div id="splash-screen">
        <div class="splash-ring"></div>
        <div class="splash-text">ITK <span>SMARTWASTE</span></div>
        <div class="splash-sub">Memuat Sistem IoT...</div>
    </div>

    <div class="login-container">
        <div class="login-left">
            <div class="glowing-orb"></div>
            <div class="brand-content">
                <div id="logo-3d-container"></div>
                <div class="logo-text">ITK <span>SMARTWASTE</span></div>
                <p class="brand-desc">Sistem Monitoring Cerdas Pemilah Sampah Berbasis AI dan IoT Terintegrasi untuk Area Kampus ITK Balikpapan.</p>
            </div>
        </div>

        <div class="login-right">
            <h2>Welcome Back</h2>
            <p>Silakan masuk ke panel kontrol admin.</p>

            <form onsubmit="event.preventDefault(); prosesLogin();">
                <div class="form-group">
                    <label class="form-label">Email Admin</label>
                    <input type="email" id="email" class="form-input" placeholder="contoh: admin@itk.ac.id" required>
                </div>
                
                <div class="form-group">
                    <label class="form-label">Password</label>
                    <input type="password" id="password" class="form-input" placeholder="Masukkan password Anda" required>
                </div>

                <button type="submit" class="btn-login" id="btn-submit">Login ke Dashboard</button>
                <div id="error-msg">Email atau Password salah!</div>
            </form>
        </div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-auth.js"></script>

    <script>
        const container3D = document.getElementById('logo-3d-container');
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(50, container3D.clientWidth / container3D.clientHeight, 0.1, 100);
        camera.position.z = 12; 
        camera.position.y = 2;
        
        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(container3D.clientWidth, container3D.clientHeight);
        renderer.setPixelRatio(window.devicePixelRatio);
        container3D.appendChild(renderer.domElement);

        const binGroup = new THREE.Group();
        const bodyGeo = new THREE.CylinderGeometry(2.5, 2.2, 7, 32);
        const bodyMat = new THREE.MeshStandardMaterial({ color: 0x1a1c1a, metalness: 0.8, roughness: 0.3 });
        const body = new THREE.Mesh(bodyGeo, bodyMat);
        binGroup.add(body);

        const wireMat = new THREE.MeshBasicMaterial({ color: 0xccff00, wireframe: true, transparent: true, opacity: 0.2 });
        const wireMesh = new THREE.Mesh(bodyGeo, wireMat);
        wireMesh.scale.set(1.03, 1.03, 1.03); 
        binGroup.add(wireMesh);

        const ringGeo = new THREE.TorusGeometry(2.6, 0.1, 8, 50);
        const ringMat = new THREE.MeshBasicMaterial({ color: 0xccff00 });
        const ring = new THREE.Mesh(ringGeo, ringMat);
        ring.position.y = 3.5;
        ring.rotation.x = Math.PI / 2;
        binGroup.add(ring);

        scene.add(binGroup);

        const ambientLight = new THREE.AmbientLight(0xffffff, 0.8);
        scene.add(ambientLight);
        
        const pointLight = new THREE.PointLight(0xccff00, 2, 50);
        pointLight.position.set(5, 5, 5);
        scene.add(pointLight);

        function animate3D() {
            requestAnimationFrame(animate3D);
            binGroup.rotation.y += 0.015;
            ring.position.y = 3.5 + Math.sin(Date.now() * 0.005) * 0.2;
            renderer.render(scene, camera);
        }
        animate3D();

        window.addEventListener('resize', () => {
            if(container3D) {
                camera.aspect = container3D.clientWidth / container3D.clientHeight;
                camera.updateProjectionMatrix();
                renderer.setSize(container3D.clientWidth, container3D.clientHeight);
            }
        });
    </script>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyDKlzNjFgaUwR3ehHq4upfANXVj0Mcc8Es", 
            authDomain: "monitoring-tempat-sampah-c7e1a.firebaseapp.com",
            projectId: "monitoring-tempat-sampah-c7e1a",
            storageBucket: "monitoring-tempat-sampah-c7e1a.firebasestorage.app",
            messagingSenderId: "41746176408",
            appId: "1:41746176408:web:f34430ca0c6a322f2433ed"
        };
        
        if (!firebase.apps.length) {
            firebase.initializeApp(firebaseConfig);
        }
        const auth = firebase.auth();

        auth.onAuthStateChanged((user) => {
            if (user) {
                // 3. PERBAIKAN PATH (Hapus garis miring di depan biar tidak error di GitHub)
                window.location.replace("dashboard.html");
            }
        });

        function prosesLogin() {
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const errorMsg = document.getElementById('error-msg');
            const btnSubmit = document.getElementById('btn-submit');

            // Ubah state tombol
            btnSubmit.innerText = "Memverifikasi...";
            btnSubmit.disabled = true; // Matikan tombol sementara

            auth.signInWithEmailAndPassword(email, password)
                .then((userCredential) => {
                    // 3. PERBAIKAN PATH
                    window.location.href = "dashboard.html";
                })
                .catch((error) => {
                    // KEMBALIKAN TOMBOL JIKA GAGAL
                    btnSubmit.innerText = "Login ke Dashboard";
                    btnSubmit.disabled = false;
                    
                    errorMsg.style.display = "block";
                    if(error.code === 'auth/user-not-found' || error.code === 'auth/wrong-password') {
                        errorMsg.innerText = "Data tidak cocok. Cek kembali email & password Anda.";
                    } else {
                        errorMsg.innerText = "Gagal login: " + error.message;
                    }
                });
        }
    </script>

    <script>
        document.addEventListener('gesturestart', function (e) { e.preventDefault(); });
        document.addEventListener('touchmove', function (e) { 
            if (e.touches.length > 1) { e.preventDefault(); } 
        }, { passive: false });
        
        let lastTouchEnd = 0;
        document.addEventListener('touchend', function (e) {
            let now = (new Date()).getTime();
            if (now - lastTouchEnd <= 300) { e.preventDefault(); }
            lastTouchEnd = now;
        }, false);
    </script>

    <script>
        // Tunggu seluruh halaman (termasuk 3D) selesai dimuat
        window.addEventListener('load', () => {
            // Beri jeda 1.5 detik biar intro-nya sempat dinikmati user
            setTimeout(() => {
                const splash = document.getElementById('splash-screen');
                splash.style.opacity = '0';
                splash.style.visibility = 'hidden';
            }, 1500); 
        });
    </script>
</body>
</html>
